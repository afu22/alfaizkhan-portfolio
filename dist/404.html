<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alfaizkhan | Developer Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If repo has subpath (e.g. username.github.io/repo-name), preserve repository segment
      if (l.hostname.endsWith('github.io') && l.pathname.split('/').length > 2) {
        var firstSeg = l.pathname.split('/')[1];
        if (!['projects', 'about', 'skills', 'contact', 'admin'].includes(firstSeg.toLowerCase())) {
          pathSegmentsToKeep = 1;
        }
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background: #080c14; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading Alfaizkhan Portfolio...</p>
  </body>
</html>
