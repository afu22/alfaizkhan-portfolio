<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="700" cy="80" r="180" fill="#10b981" opacity="0.08" filter="blur(60px)"/>
  <circle cx="100" cy="380" r="160" fill="#6366f1" opacity="0.06" filter="blur(60px)"/>

  <!-- Window Frame -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0d1424" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="78" cy="68" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="98" cy="68" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="118" cy="68" r="6" fill="#10b981" opacity="0.8"/>
  <line x1="50" y1="92" x2="750" y2="92" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Category Tag -->
  <rect x="80" y="125" width="130" height="28" rx="14" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="145" y="143" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">WEB DEVELOPMENT</text>

  <!-- Title -->
  <text x="80" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">TruckPack</text>

  <!-- Decorative Graphic Lines -->
  <rect x="80" y="235" width="280" height="4" rx="2" fill="url(#glow)"/>
  <text x="80" y="275" fill="#94a3b8" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="14">~/alfaizkhan/projects/truckpack</text>

  <!-- Tech tags -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="600" height="40" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="25" fill="#cbd5e1" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13">Stack: JavaScript · Node.js · Express · MySQL · Leaflet</text>
  </g>
</svg>